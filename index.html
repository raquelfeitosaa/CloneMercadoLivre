<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Mercado Livre</title>
</head>

<body>
    <header class="header">
        <div class="container">
            <img class="logo"
                src="https://http2.mlstatic.com/storage/pog-cm-admin/calm-assets/mercado-libre-thumbnail--1538x1510--b612412b.webp"
                alt="logo-mercado-livre">
            <input class="search-input" type="text" id="searchInput" placeholder="Buscar produtos...">
            <button id="searchBtn" class="search-btn">
                <i class="fa-solid fa-magnifying-glass">
                </i></button>
        </div>
    </header>

    <section class="hero">
        <h1>Ofertas Imperdíveis</h1>
        <p>Black Friday da Maior</p>
    </section>

    <main class="main">
        <div class="container-main">
            <h2 class="section-title">Ofertas do dia
            </h2>
            <div class="products-grid" id="productsGrid">
            </div>
        </div>
    </main>


    <footer class="footer">
        <p>Clone do Mercado Live - Raquel Feitosa</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
